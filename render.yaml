databases:
  - name: researchpilot-db
    plan: free
    databaseName: researchpilot_db
    user: researchpilot_user

services:
  # 1. FastAPI Backend Service (Docker-based)
  - type: web
    name: researchpilot-backend
    env: docker
    repo: https://github.com/vedang-rajendra-dhuri/ResearchPilot
    branch: main
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: researchpilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

  # 2. React Frontend Static Site
  - type: web
    name: researchpilot-frontend
    runtime: static
    repo: https://github.com/vedang-rajendra-dhuri/ResearchPilot
    branch: main
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: researchpilot-backend
          property: url
