services:
  # 1. PostgreSQL Database with pgvector support
  - type: postgres
    name: researchpilot-db
    plan: free # Change to standard/pro as needed
    ipAllowList: [] # Allow all internal connections

  # 2. FastAPI Backend Service (Docker-based)
  - type: web
    name: researchpilot-backend
    env: docker
    repo: https://github.com/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME # Update with your GitHub repo URL
    branch: main
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: researchpilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

  # 3. React Frontend Static Site
  - type: static
    name: researchpilot-frontend
    repo: https://github.com/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME # Update with your GitHub repo URL
    branch: main
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: researchpilot-backend
          property: url