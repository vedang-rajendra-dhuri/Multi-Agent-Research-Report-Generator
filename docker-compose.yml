services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-researchpilot}
      POSTGRES_USER: ${POSTGRES_USER:-researchpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-researchpilot-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-researchpilot} -d ${POSTGRES_DB:-researchpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://researchpilot:researchpilot-local@db:5432/researchpilot}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a random secret of at least 32 characters}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      SEARCH_PROVIDER_API_KEY: ${SEARCH_PROVIDER_API_KEY:-}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-60}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.research"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://researchpilot:researchpilot-local@db:5432/researchpilot}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a random secret of at least 32 characters}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-}
      SEARCH_PROVIDER_API_KEY: ${SEARCH_PROVIDER_API_KEY:-}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-60}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data: